<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>DEMO – Biomass Sampler Lite</title>
<meta name="theme-color" content="#173f31">
<meta name="description" content="Simple tree and carbon recording for community forest plots.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--g:#173f31;--g2:#2f6b4f;--l:#e8f1ea;--gold:#e3a72f;--ink:#1c2420;--mut:#5d6b63;--bad:#b3261e;--bg:#f6f7f3;--card:#fff;--r:16px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--g);color:#fff;padding:14px 18px calc(14px);padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0;font-weight:700;flex:1}
header button{background:none;border:0;color:#fff;font-size:16px;padding:6px 4px;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
h2{font-size:24px;margin:6px 0 6px;line-height:1.2}
p{margin:6px 0 12px}
.mut{color:var(--mut);font-size:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:var(--r);padding:18px;margin:12px 0;font:inherit;font-size:20px;font-weight:650;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.big.pri{background:var(--g);color:#fff}
.big small{display:block;font-weight:400;font-size:15px;opacity:.85}
.big svg{flex:none;width:40px;height:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 20px;border-radius:14px;border:2px solid var(--g);background:#fff;color:var(--g);font:inherit;font-weight:650;cursor:pointer}
.btn.pri{background:var(--g);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241a02}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
label{display:block;font-weight:650;margin:14px 0 6px}
input,select{width:100%;font:inherit;font-size:20px;padding:14px;border:2px solid #cfd8d1;border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:3px solid var(--gold);border-color:var(--g)}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{border:2px solid #cfd8d1;background:#fff;border-radius:999px;padding:12px 18px;font:inherit;font-size:17px;cursor:pointer}
.pill.on{background:var(--g);border-color:var(--g);color:#fff}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{flex:1;height:8px;border-radius:4px;background:#d6ded8}
.steps i.on{background:var(--g2)}.steps i.now{background:var(--gold)}
.tip{display:flex;gap:12px;background:var(--l);border-radius:14px;padding:14px;font-size:17px}
.tip svg{flex:none;width:64px;height:64px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sugg button{border:1px solid #cfd8d1;background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:16px;cursor:pointer;text-align:left}
.sugg button i{display:block;font-size:13px;color:var(--mut);font-style:italic}
.list{margin:8px 0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #e3e8e4}
.list li .n{flex:1}
.list li b{font-weight:650}
.list li .x{border:0;background:#f4e3e1;color:var(--bad);width:44px;height:44px;border-radius:12px;font-size:22px;cursor:pointer}
.count{font-size:15px;color:var(--mut)}
.warn{color:var(--bad);font-weight:600;margin-top:8px}
.ok{color:var(--g2);font-weight:650}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dde3df;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:6}
.bar .btn{flex:1}
.result{background:var(--g);color:#fff;border-radius:var(--r);padding:22px;text-align:center}
.result b{display:block;font-size:52px;line-height:1.1}
.result span{font-size:17px;opacity:.9}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:17px}
.kv div:nth-child(even){text-align:right;font-weight:650}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:58px;height:58px;border-radius:14px;border:2px solid var(--g);background:#fff;color:var(--g);font-size:28px;cursor:pointer}
.stepper input{text-align:center}
.seg{display:flex;border:2px solid var(--g);border-radius:12px;overflow:hidden;margin-top:6px}
.seg button{flex:1;border:0;background:#fff;color:var(--g);padding:10px;font:inherit;font-size:16px;cursor:pointer}
.seg button.on{background:var(--g);color:#fff}
table{width:100%;border-collapse:collapse;font-size:17px}
td,th{padding:10px 6px;border-bottom:1px solid #e3e8e4;text-align:left}
th{font-size:14px;color:var(--mut);font-weight:600}
td.r,th.r{text-align:right}
#toast{position:fixed;left:16px;right:16px;bottom:96px;background:#1c2420;color:#fff;padding:14px 16px;border-radius:14px;display:none;z-index:9;font-size:17px;max-width:528px;margin:0 auto}
.gps{display:flex;gap:12px;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;background:#c9d1cb;flex:none}
.dot.live{background:var(--gold);animation:p 1s infinite}.dot.done{background:var(--g2)}
@keyframes p{50%{opacity:.3}}
</style>
</head>

<script>
/* ---- Biomass & carbon engine ---- */
const DEFAULTS = {
  model: 'chid12',          // above-ground allometric model (see MODELS)
  root: 'ipcc',             // below-ground model (see ROOTS)
  a: 2.342, b: -2.059,      // coefficients of the "custom" model: AGB = exp(a*ln(D) + b)
  cf: 0.47,                 // carbon fraction (IPCC 2006)
  rs: 0.28,                 // root:shoot ratio for the IPCC ratio option
  wdDefault: 0.619,         // wood density (g/cm3) when a species has no value
  dw: 619,                  // dead-wood density kg/m3
  r: { regen: 5, sap: 14, tree: 20, stump: 20 },  // nested plot RADII (m); stump shares the tree plot
  v: 3,
  legacyStump: false,       // true = reproduce workbook formula  pi*(D/2^2)*H/1e6
  sapMin: 5, treeMin: 10,

const LN = Math.log, EXP = Math.exp, POW = Math.pow;
/* Above-ground biomass models. D cm, H m, W = wood density g/cm3. Returns kg dry mass.
   needs: D = diameter, H = height, W = wood density. fb = model used when a needed height is missing. */
const MODELS = {
  chid12:   { name: 'Chidumayo (2012) – Zambia national model', short: 'Chidumayo 2012', needs: 'D',
              eq: 'AGB = exp(2.342·ln D − 2.059)', f: (d) => EXP(2.342 * LN(d) - 2.059) },
  chave14:  { name: 'Chave et al. (2014) – pantropical, with height', short: 'Chave 2014', needs: 'DHW', fb: 'chave05dryD', range: [5, 180],
              eq: 'AGB = 0.0673·(ρD²H)^0.976', f: (d, h, w) => 0.0673 * POW(w * d * d * h, 0.976) },
  chave05dry: { name: 'Chave et al. (2005) – tropical dry forest, with height', short: 'Chave 2005 dry', needs: 'DHW', fb: 'chave05dryD', range: [5, 156],
              eq: 'AGB = 0.112·(ρD²H)^0.916', f: (d, h, w) => 0.112 * POW(w * d * d * h, 0.916) },
  chave05dryD: { name: 'Chave et al. (2005) – tropical dry forest, no height', short: 'Chave 2005 dry (no H)', needs: 'DW', range: [5, 156],
              eq: 'AGB = ρ·exp(−0.667 + 1.784 ln D + 0.207 (ln D)² − 0.0281 (ln D)³)',
              f: (d, h, w) => { const L = LN(d); return w * EXP(-0.667 + 1.784 * L + 0.207 * L * L - 0.0281 * L * L * L); } },
  mug13:    { name: 'Mugasha et al. (2013) – miombo, diameter only', short: 'Mugasha 2013', needs: 'D', range: [1.1, 110],
              eq: 'AGB = 0.1027·D^2.4798', f: (d) => 0.1027 * POW(d, 2.4798) },
  mug13h:   { name: 'Mugasha et al. (2013) – miombo, with height', short: 'Mugasha 2013 (H)', needs: 'DH', fb: 'mug13', range: [1.1, 110],
              eq: 'AGB = 0.0763·D^2.2046·H^0.4918', f: (d, h) => 0.0763 * POW(d, 2.2046) * POW(h, 0.4918) },
  kach16:   { name: 'Kachamba, Eid & Gobakken (2016) – Malawi miombo, with height', short: 'Kachamba 2016', needs: 'DH', fb: 'mug13', range: [5.3, 111.2],
              eq: 'AGB = 0.103685·D^1.921719·H^0.844561', f: (d, h) => 0.103685 * POW(d, 1.921719) * POW(h, 0.844561) },
  ryan11:   { name: 'Ryan, Williams & Grace (2011) – Mozambique miombo', short: 'Ryan 2011', needs: 'D', range: [5, 73],
              eq: 'AGB = exp(2.601·ln D − 3.629) ÷ 0.47', f: (d) => EXP(2.601 * LN(d) - 3.629) / 0.47 },
  custom:   { name: 'Custom: exp(a·ln D + b), a and b from settings', short: 'Custom', needs: 'D',
              eq: 'AGB = exp(a·ln D + b)', f: (d, h, w, P) => EXP(P.a * LN(d) + P.b) }
};
/* Below-ground biomass models. Returns kg dry mass. */
const ROOTS = {
  ipcc:   { name: 'Root-to-shoot ratio (IPCC 2006), ratio from settings', short: 'R:S ratio', eq: 'BGB = AGB × R', f: (agb, d, P) => agb * P.rs },
  mug13:  { name: 'Mugasha et al. (2013) – miombo', short: 'Mugasha 2013', range: [3.3, 95], eq: 'BGB = 0.2113·D^1.9838', f: (agb, d) => 0.2113 * POW(d, 1.9838) },
  kach16: { name: 'Kachamba, Eid & Gobakken (2016) – Malawi miombo', short: 'Kachamba 2016', eq: 'BGB = 0.284615·D^1.992658', f: (agb, d) => 0.284615 * POW(d, 1.992658) },
  ryan11: { name: 'Ryan, Williams & Grace (2011) – Mozambique miombo', short: 'Ryan 2011', range: [5, 72], eq: 'BGB = exp(2.262·ln D − 3.370) ÷ 0.47', f: (agb, d) => EXP(2.262 * LN(d) - 3.370) / 0.47 }
};

function woodDensity(rec, P) {
  if (+rec.wd > 0) return { w: +rec.wd, src: 'entered' };

const plotArea = r => Math.PI * r * r;

}
function plotSummary(plot, recs, P) {
  P = plotParams(plot, P);
  const o = { n: { regen: 0, sap: 0, tree: 0, stump: 0 }, c: { sap: 0, tree: 0, stump: 0 }, agb: { sap: 0, tree: 0 }, stems: 0, fb: 0, out: 0 };

    if (r.p !== plot.id) continue;
    if (r.t === 'regen') { o.n.regen++; o.stems += regenTotal(r); continue; }
    o.n[r.t]++;
    const k = recCalc(r, P);
    o.c[r.t] += k.tc;
    if (r.t !== 'stump') { o.agb[r.t] += k.agb; if (k.fb) o.fb++; if (k.out) o.out++; }
  }
  const s = o.c.sap / plotArea(P.r.sap) * 10, t = o.c.tree / plotArea(P.r.tree) * 10, w = o.c.stump / plotArea(P.r.stump) * 10;
  o.tha = { sap: s, tree: t, stump: w, total: s + t + w };
  o.co2 = o.tha.total * 44 / 12;
  o.regenHa = o.stems / plotArea(P.r.regen) * 10000;

}

function stats(arr) {
  const n = arr.length; if (!n) return { n: 0, mean: 0, sd: 0, se: 0, ci: 0 };

  const sd = n > 1 ? Math.sqrt(arr.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1)) : 0;
  const se = sd / Math.sqrt(n), t = n > 1 ? (T95[n - 1] || 1.96) : 0;

/* ---------- species search ---------- */
const SP=(()=>{const m=new Map();for(const[l,s]of SPECIES){const n=l||s;if(!n)continue;const k=(n+'|'+s).toLowerCase();if(!m.has(k))m.set(k,{n,s,k:n.toLowerCase(),ks:(s||'').toLowerCase()})}return[...m.values()]})();
function findSp(q){q=q.trim().toLowerCase();if(q.length<2)return[];const a=[],b=[];for(const x of SP){if(x.k.startsWith(q)||x.ks.startsWith(q))a.push(x);else if(x.k.includes(q)||x.ks.includes(q))b.push(x);if(a.length>=6)break}return[...a,...b].slice(0,6)}
function sciFor(name){const k=name.trim().toLowerCase(),hits=SP.filter(x=>x.k===k),u=[...new Set(hits.map(x=>x.s))];return u.length===1?u[0]:''}

let view='home',cur=null,step=0,mode='new';
function go(v,o={}){stopGps();$('#app').onclick=null;view=v;if('step'in o)step=o.step;if('mode'in o)mode=o.mode;render();window.scrollTo(0,0)}
function bar(html){const b=$('#bar');if(!html){b.hidden=true;b.innerHTML='';return}b.hidden=false;b.innerHTML=html}
function render(){$('#homeBtn').hidden=view==='home';({home,plots,wiz,results,send,help}[view])()}
$('#homeBtn').onclick=()=>go('home');

function newPlot(){if(demoFull(S))return;cur={id:uid(),site:'',district:'',no:'',strata:'',lat:null,lon:null,gpsAcc:null,gpsN:null,date:new Date().toISOString().slice(0,10),crew:S.who||'',r:lastR(),model:'chid12',root:'ipcc',src:'lite'};go('wiz',{step:0,mode:'new'})}
function home(){bar('');
  const n=S.plots.length,all=S.plots.map(sumPlot),avg=n?all.reduce((a,s)=>a+s.tha.total,0)/n:0;

  <button class="big" id="hHelp">${IC.help}<span>How to measure<small>Short guide for the field</small></span></button>`;
  $('#hNew').onclick=newPlot;
  $('#hPlots').onclick=()=>go('plots');$('#hRes').onclick=()=>go('results');$('#hSend').onclick=()=>go('send');$('#hHelp').onclick=()=>go('help')}

function plots(){bar('<button class="btn pri" id="bNew">+ New plot</button>');$('#bNew').onclick=newPlot;
  $('#app').innerHTML=`<h2>My plots</h2>${S.plots.length?'<p class="mut">Tap a plot to see it or add more trees.</p>':'<p class="mut">No plots yet.</p>'}
  ${S.plots.slice().reverse().map(p=>{const s=sumPlot(p);return `<button class="big" data-id="${p.id}"><span style="flex:1">${esc(p.pid)}<small>${esc(p.strata)} · ${esc(p.date)} · ${s.n.sap} small trees, ${s.n.tree} big trees</small></span><span style="text-align:right;font-size:22px">${f(s.tha.total)}<small>t C/ha</small></span></button>`}).join('')}`;

/* ---------- plot wizard ---------- */
const STEPS=['Plot','Young plants','Small trees','Big trees','Stumps','Done'];
function wiz(){const st=`<div class="steps">${STEPS.map((x,i)=>`<i class="${i<step?'on':i===step?'now':''}"></i>`).join('')}</div><p class="count">Step ${step+1} of ${STEPS.length}: ${STEPS[step]}</p>`;
  [wPlot,wRegen,()=>wStems('sap'),()=>wStems('tree'),wStump,wDone][step](st)}
function nav(next,back=true,nextLabel='Next'){bar(`${back?'<button class="btn" id="bBack">Back</button>':''}<button class="btn pri" id="bNext">${nextLabel}</button>`);
  if(back)$('#bBack').onclick=()=>{step--;go('wiz')};$('#bNext').onclick=next}

   <p style="margin:12px 0 0"><a href="#" id="gHand">Type the location instead</a></p>
   <div id="hand" hidden><label for="lat">Latitude (e.g. -13.512345)</label><input id="lat" inputmode="decimal" value="${cur.lat??''}"><label for="lon">Longitude (e.g. 28.254321)</label><input id="lon" inputmode="decimal" value="${cur.lon??''}"></div></div>`;
  $('#site').onchange=e=>$('#newSite').hidden=e.target.value!=='__new';
  $('#land').onclick=e=>{const b=e.target.closest('.pill');if(!b)return;cur.strata=b.textContent;[...$('#land').children].forEach(x=>x.classList.toggle('on',x===b))};
  let prevTree=pr().tree;$('#rad').oninput=e=>{if(e.target.id==='r-tree'){const v=parseFloat(e.target.value);if(parseFloat($('#r-stump').value)===prevTree&&v>0)$('#r-stump').value=v;if(v>0)prevTree=v}const r=readR();if(Object.values(r).every(x=>x>0))$('#radTxt').textContent=radTxt(r)};
  $('#radStd').onclick=()=>{for(const k in STD_R)$('#r-'+k).value=STD_R[k];prevTree=STD_R.tree;$('#radTxt').textContent=radTxt(STD_R)};
  $('#gBtn').onclick=startGps;$('#gBest').onclick=()=>useFix(best,1);
  $('#gHand').onclick=e=>{e.preventDefault();$('#hand').hidden=false;$('#lat').focus()};
  nav(()=>{let site=$('#site').value,district=sites[site]||'';
    if(site==='__new'){site=$('#ns').value.trim();district=$('#nd').value.trim();if(!site)return toast('Type the site name');S.sites[site]=district}
    if(!site)return toast('Choose the site');const no=$('#no').value.trim();if(!no)return toast('Type the plot number');if(!cur.strata)return toast('Tap the land type');
    const pid=site.replace(/\s+/g,'')+no;if(S.plots.some(p=>p.pid===pid&&p.id!==cur.id))return toast(`Plot ${pid} already exists. Use another number.`);
    if(!$('#hand').hidden){const la=parseFloat($('#lat').value),lo=parseFloat($('#lon').value);if($('#lat').value||$('#lon').value){if(!(Math.abs(la)<=90&&Math.abs(lo)<=180))return toast('Check the latitude and longitude');if(la!==cur.lat||lo!==cur.lon){cur.lat=la;cur.lon=lo;cur.gpsAcc=null;cur.gpsN=null}}}
    const r=readR();if(!Object.values(r).every(x=>x>0&&x<=100)){$('#rad').open=true;return toast('Each plot size must be a number of metres between 0 and 100')}
    if(!(r.regen<=r.sap&&r.sap<=r.tree)){$('#rad').open=true;return toast('Circles must get bigger: young plants ≤ small trees ≤ big trees')}
    Object.assign(cur,{site,district,no,pid,crew:$('#who').value.trim(),r});S.who=cur.crew;S.r=r;
    if(!plotOf(cur.id)){if(demoFull(S))return;S.plots.push(cur)}save();

    step=mode==='edit'?5:1;go('wiz')},false,mode==='edit'?'Save':'Next')}

/* GPS: keep fixes of ±4 m or better and average them (weight 1/accuracy²) */
let watch=null,fixes=[],best=null,gT=null;
const radTxt=r=>`${r.regen} / ${r.sap} / ${r.tree} / ${r.stump} m`;
function readR(){const o={};for(const k of['regen','sap','tree','stump'])o[k]=parseFloat($('#r-'+k).value);return o}
function locText(){return `<span class="ok">Location saved</span> ${f(cur.lat,6)}, ${f(cur.lon,6)}${cur.gpsAcc!=null?` (within ${f(cur.gpsAcc)} m)`:''}`}
function stopGps(){if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;clearTimeout(gT)}
function startGps(){if(!navigator.geolocation)return gMsg('This phone or browser cannot give a location. Type it instead.');
  if(!window.isSecureContext)return gMsg('Location only works when the app is opened from its https web address or installed. Type the location instead.');
  stopGps();fixes=[];best=null;$('#gDot').className='dot live';$('#gBest').hidden=true;gMsg('Looking for satellites… keep still.');$('#gBtn').textContent='Searching…';
  watch=navigator.geolocation.watchPosition(onFix,e=>{if(e.code===1){stopGps();$('#gDot').className='dot';$('#gBtn').textContent='Get my location';gMsg('<span class="warn">Location is switched off for this app.</span> Open the phone settings → Apps or Browser → Permissions → Location → Allow, then try again.')}},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  gT=setTimeout(()=>{if(best){$('#gBest').hidden=false;$('#gBest').textContent=`Use it anyway (±${f(best.acc,0)} m)`}},20000)}
function gMsg(h){const m=$('#gMsg');if(m)m.innerHTML=h}
function onFix(pos){const c=pos.coords,x={lat:c.latitude,lon:c.longitude,acc:c.accuracy};if(!best||x.acc<best.acc)best=x;
  if(x.acc<=P0.gpsMax){fixes.push(x);gMsg(`Good signal (±${f(x.acc)} m). Taking reading ${fixes.length} of 5…`);if(fixes.length>=5){let w=0,la=0,lo=0;for(const q of fixes){const k=1/(q.acc*q.acc);w+=k;la+=q.lat*k;lo+=q.lon*k}useFix({lat:la/w,lon:lo/w,acc:Math.min(...fixes.map(q=>q.acc))},fixes.length)}}
  else gMsg(`Signal is weak (±${f(x.acc,0)} m). Need ±${P0.gpsMax} m or better. Move away from trees or buildings and wait…`)}
function useFix(x,n){if(!x)return;stopGps();cur.lat=+x.lat.toFixed(6);cur.lon=+x.lon.toFixed(6);cur.gpsAcc=+x.acc.toFixed(1);cur.gpsN=n;$('#gDot').className='dot done';$('#gBtn').textContent='Get location again';$('#gBest').hidden=true;gMsg(locText())}

/* trees and small trees */
function wStems(t){const R=pr(),big=t==='tree',r=big?R.tree:R.sap,min=big?TREE_C:SAP_C,max=big?null:TREE_C,mt=S.mt||'C',recs=recsOf(cur.id,t);
  const rule=mt==='C'?(big?`${min} cm or more around`:`${min} to ${max-1} cm around`):(big?`${P0.treeMin} cm or more across`:`${P0.sapMin} to ${P0.treeMin-0.1} cm across`);
  $('#app').innerHTML=`<p class="count" style="margin:0">${esc(cur.pid)}</p>${st()}<h2>${big?'Big trees':'Small trees'}</h2>
  <div class="tip">${IC.ring(r)}<div>Walk <b>${r} m</b> from the centre. Measure every tree <b>${rule}</b> at chest height (1.3 m).${big?'':' Count only inside the smaller circle.'}</div></div>
  <div class="card"><label for="nm" style="margin-top:0">Tree name</label><input id="nm" autocomplete="off" placeholder="Type local or English name"><div class="sugg" id="sg"></div>
  <label for="m">${mt==='C'?'Distance around the trunk (cm)':'Width of the trunk (cm)'}</label><input id="m" inputmode="decimal" placeholder="${mt==='C'?'e.g. 45':'e.g. 14'}">
  <div class="seg" id="mt"><button type="button" class="${mt==='C'?'on':''}" data-v="C">Tape around trunk</button><button type="button" class="${mt==='D'?'on':''}" data-v="D">Diameter tape</button></div>
  <div id="w"></div><button class="btn gold wide" style="margin-top:14px" id="add">Add this tree</button></div>
  <h2 style="font-size:20px">Recorded here: ${recs.length}</h2>${stemList(recs)}`;
  wireName();
  $('#mt').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.mt=b.dataset.v;save();wStems(t)};
  $('#m').oninput=()=>{const v=parseFloat($('#m').value),d=toDbh(v,S.mt||'C');$('#w').innerHTML=!(v>0)?'':big&&d<P0.treeMin?`<p class="warn">This is a small tree. Go back one step to add it if it is inside ${R.sap} m.</p>`:!big&&d>=P0.treeMin?'<p class="warn">This is a big tree. Add it in the next step.</p>':!big&&d<P0.sapMin?`<p class="warn">Too small to count as a tree. Go back to Young plants to count it if it is inside ${R.regen} m.</p>`:d>150?'<p class="warn">That is very large – please check the number.</p>':''};
  $('#add').onclick=()=>{const l=$('#nm').value.trim(),m=parseFloat($('#m').value),d=toDbh(m,S.mt||'C');if(!l)return toast('Type the tree name (or “Unknown”)');if(!(m>0))return toast('Type the measurement');
    if(big&&d<P0.treeMin)return toast('Too small for a big tree – go back one step and add it under Small trees');if(!big&&(d>=P0.treeMin||d<P0.sapMin))return toast(d>=P0.treeMin?'That is a big tree – add it in the next step, Big trees':'Too small – go back and count it under Young plants');
    S.recs.push({id:uid(),p:cur.id,t,l,s:$('#nm').dataset.s||sciFor(l),c:'',m,mt:S.mt||'C',h:null,bh:null,u:'',q:'S',hs:'H',ts:new Date().toISOString()});save();toast(`${l} added`);wStems(t);$('#nm').focus()};
  $('#app').querySelectorAll('.x').forEach(b=>b.onclick=()=>delRec(b.dataset.id,()=>wStems(t)));
  nav(()=>{step=mode==='edit'?5:step+1;go('wiz')},mode!=='edit',mode==='edit'?'Done':(recs.length?'Next':'None here – Next'))}
function st(){return `<div class="steps">${STEPS.map((x,i)=>`<i class="${i<step?'on':i===step?'now':''}"></i>`).join('')}</div><p class="count">Step ${step+1} of ${STEPS.length}: ${STEPS[step]}</p>`}
function stemList(recs){if(!recs.length)return '<p class="mut">None yet.</p>';return `<ul class="list">${recs.slice().reverse().map(r=>{const k=recCalc(r,P0);return `<li><span class="n"><b>${esc(r.l)}</b><br><span class="count">${r.mt==='C'?f(r.m,0)+' cm around':f(r.m,1)+' cm across'} · ${f(k.tc,1)} kg carbon (${f(k.tc/1000,4)} t)</span></span><button class="x" data-id="${r.id}" aria-label="Remove">×</button></li>`}).join('')}</ul>`}
function wireName(){const nm=$('#nm'),sg=$('#sg');nm.oninput=()=>{nm.dataset.s='';sg.innerHTML=findSp(nm.value).map(x=>`<button type="button" data-n="${esc(x.n)}" data-s="${esc(x.s)}">${esc(x.n)}${x.s&&x.s!==x.n?`<i>${esc(x.s)}</i>`:''}</button>`).join('')};
  sg.onclick=e=>{const b=e.target.closest('button');if(!b)return;nm.value=b.dataset.n;nm.dataset.s=b.dataset.s;sg.innerHTML='';const m=$('#m');if(m)m.focus();else $('#cnt')&&$('#cnt').focus()}}
function delRec(id,then){const r=S.recs.find(x=>x.id===id);if(!r||!confirm(`Remove ${r.l}?`))return;S.recs=S.recs.filter(x=>x.id!==id);save();then()}

/* result for this plot */
function wDone(){const s=sumPlot(cur);
  $('#app').innerHTML=`<h2>${esc(cur.pid)}</h2><p class="mut">${esc(cur.strata)} · ${esc(cur.site)}${cur.district?', '+esc(cur.district):''} · ${esc(cur.date)}</p>

  <div class="card kv"><div>Young plants</div><div>${f(s.regenHa,0)} per ha</div><div>Small trees (${s.n.sap})</div><div>${f(s.tha.sap)} t C/ha</div><div>Big trees (${s.n.tree})</div><div>${f(s.tha.tree)} t C/ha</div><div>Stumps (${s.n.stump})</div><div>${f(s.tha.stump)} t C/ha</div><div>Plot size</div><div>${radTxt(pr())}</div><div>Location</div><div>${cur.lat!=null?'Saved':'<span class="warn">Missing</span>'}</div></div>

  bar('<button class="btn" id="bPl">My plots</button><button class="btn pri" id="bHome">Finish</button>');$('#bPl').onclick=()=>go('plots');$('#bHome').onclick=()=>go('home')}

/* ---------- results across plots ---------- */
function results(){bar('');const all=S.plots.map(p=>({p,s:sumPlot(p)}));
  if(!all.length){$('#app').innerHTML='<h2>Results</h2><p class="mut">Record a plot first.</p>';return}
  const g={};for(const x of all)(g[x.p.strata]=g[x.p.strata]||[]).push(x.s.tha.total);
  const st=stats(all.map(x=>x.s.tha.total));
  $('#app').innerHTML=`<h2>Results</h2><div class="result"><b>${f(st.mean)}</b><span>average tonnes of carbon per hectare, from ${st.n} plot${st.n>1?'s':''}</span>${st.n>1?`<p style="margin:10px 0 0;font-size:16px">Most likely between ${f(Math.max(0,st.mean-st.ci))} and ${f(st.mean+st.ci)} (95% range)</p>`:''}</div>
  <div class="card"><b>By land type</b><table><thead><tr><th>Land type</th><th class="r">Plots</th><th class="r">t C/ha</th></tr></thead><tbody>${Object.keys(g).sort().map(k=>`<tr><td>${esc(k)}</td><td class="r">${g[k].length}</td><td class="r">${f(g[k].reduce((a,b)=>a+b,0)/g[k].length)}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><b>Each plot</b><table><tbody>${all.slice().sort((a,b)=>b.s.tha.total-a.s.tha.total).map(x=>`<tr><td>${esc(x.p.pid)}</td><td class="r">${f(x.s.tha.total)} t C/ha</td></tr>`).join('')}</tbody></table></div>
  <p class="mut">Carbon = tree size → wood weight (Chidumayo 2012, Zambia’s national equation) plus roots (28%) × 0.47. One tonne of carbon equals 3.67 tonnes of CO₂.</p>`}

/* ---------- send data ---------- */
/* CSV tables: plot summary + one row per record for each section, with the plot details on every row */
const n4=x=>x==null||isNaN(x)?'':+(+x).toFixed(4),n6=x=>x==null||isNaN(x)?'':+(+x).toFixed(6);
const PH=['District','Plot_Unique_id','Site','Plot Number','Strata','Latitude (DD, WGS84)','Longitude (DD, WGS84)','Date','Recorder'];
const pcols=p=>[p.district,p.pid,p.site,/^\d+$/.test(p.no)?+p.no:p.no,p.strata,p.lat??'',p.lon??'',p.date,p.crew];
const pp=id=>plotParams(plotOf(id),P0);
const recRows=t=>{const order=new Map(S.plots.map((p,i)=>[p.id,i]));return S.recs.filter(r=>r.t===t&&order.has(r.p)).sort((a,b)=>order.get(a.p)-order.get(b.p))};
function rowsPlots(){const H=[...PH,'GPS accuracy (m)','Young plants radius (m)','Small trees radius (m)','Big trees radius (m)','Stumps radius (m)','Young plant species','Young plants','Young plants per ha','Small trees','Big trees','Stumps','Small trees t C/ha','Big trees t C/ha','Dead wood t C/ha','Total t C/ha','t CO2e/ha'];
  return ([H,...S.plots.map(p=>{const s=sumPlot(p),r=pp(p.id).r;return[...pcols(p),p.gpsAcc??'',r.regen,r.sap,r.tree,r.stump,s.n.regen,s.stems,n4(s.regenHa),s.n.sap,s.n.tree,s.n.stump,n4(s.tha.sap),n4(s.tha.tree),n4(s.tha.stump),n4(s.tha.total),n4(s.co2)]})])}
function rowsRegen(){return ([[...PH,'Local Name','Scientific Name','Number','Plot radius (m)','Plot area (m2)','Stems per ha'],...recRows('regen').map(r=>{const p=plotOf(r.p),R=pp(r.p).r.regen,a=plotArea(R),n=regenTotal(r);return[...pcols(p),r.l,r.s,n,R,n4(a),n4(n/a*10000)]})])}
function rowsStems(t){const key=t==='sap'?'sap':'tree';return ([[...PH,'Local Name','Scientific Name','Measured as','Reading (cm)','DBH (cm)','Plot radius (m)','AGB (kg)','BGB (kg)','Total biomass (kg)','Carbon (kg C)','Carbon (t C)','t CO2e','t C/ha'],
  ...recRows(t).map(r=>{const p=plotOf(r.p),Q=pp(r.p),k=recCalc(r,Q);return[...pcols(p),r.l,r.s,r.mt==='C'?'Circumference':'Diameter',r.m,n4(k.d),Q.r[key],n4(k.agb),n4(k.bgb),n4(k.agb+k.bgb),n4(k.tc),n6(k.tc/1000),n6(k.tc/1000*44/12),n6(k.m2*10)]})])}
function rowsStumps(){return ([[...PH,'Local Name','Scientific Name','Measured as','Reading (cm)','Diameter (cm)','Height (m)','Plot radius (m)','Volume (m3)','Dead wood biomass (kg)','Carbon (kg C)','Carbon (t C)','t CO2e','t C/ha'],
  ...recRows('stump').map(r=>{const p=plotOf(r.p),Q=pp(r.p),k=recCalc(r,Q);return[...pcols(p),r.l,r.s,r.mt==='C'?'Circumference':'Diameter',r.m,n4(k.d),r.h,Q.r.stump,n6(k.vol),n4(k.bm),n4(k.tc),n6(k.tc/1000),n6(k.tc/1000*44/12),n6(k.m2*10)]})])}
function rowsAll(){const H=['Record type',...PH,'Local Name','Scientific Name','Number','Measured as','Reading (cm)','DBH or diameter (cm)','Height (m)','Plot radius (m)','Stems per ha','AGB (kg)','BGB (kg)','Total biomass (kg)','Volume (m3)','Carbon (kg C)','Carbon (t C)','t CO2e','t C/ha','t CO2e/ha'];
  const out=[H];for(const p of S.plots){const s=sumPlot(p),Q=pp(p.id),pc=pcols(p),rs=recsOf(p.id);

/* minimal Excel writer: one sheet per table, values only, bold header row, frozen and filterable */
function xlsx(sheets){const col=n=>{let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s};
  const xe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
  const cell=(v,ref,st)=>{if(v===''||v==null)return'';if(typeof v==='number'&&isFinite(v))return `<c r="${ref}"${st?` s="${st}"`:''}><v>${v}</v></c>`;return `<c r="${ref}" t="inlineStr"${st?` s="${st}"`:''}><is><t xml:space="preserve">${xe(v)}</t></is></c>`};
  const sheetX=(rows,about)=>{const nc=Math.max(1,...rows.map(r=>r.length)),w=[...Array(nc)].map((_,j)=>Math.min(about&&j===1?90:42,Math.max(8,...rows.slice(0,200).map(r=>String(r[j]??'').length+2))));
    const fr=about?'':`<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${fr}<cols>${w.map((x,j)=>`<col min="${j+1}" max="${j+1}" width="${x}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.map((r,i)=>`<row r="${i+1}">${r.map((v,j)=>cell(v,col(j)+(i+1),about?(j===0&&r.length===1&&i!==1?2:0):(i===0?1:0))).join('')}</row>`).join('')}</sheetData>${about||rows.length<2?'':`<autoFilter ref="A1:${col(nc-1)}${rows.length}"/>`}</worksheet>`};
  const ws=sheets.map(([n,r])=>sheetX(r,n==='About'));
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font><font><b/><sz val="11"/><color rgb="FF173F31"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF173F31"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map(([n],i)=>`<sheet name="${xe(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets><definedNames>${sheets.map(([n,r],i)=>n!=='About'&&r.length>1?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${n}'!$A$1:$${col(Math.max(...r.map(x=>x.length))-1)}$${r.length}</definedName>`:'').join('')}</definedNames></workbook>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const root=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  return new Blob([zip([['[Content_Types].xml',ct],['_rels/.rels',root],['xl/workbook.xml',wb],['xl/_rels/workbook.xml.rels',rels],['xl/styles.xml',styles],...ws.map((x,i)=>[`xl/worksheets/sheet${i+1}.xml`,x])])],{type:XMIME})}

/* minimal ZIP (stored) so all files save as one download */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;const d=new Date(),dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const[name,txt]of files){const nb=enc.encode(name),data=enc.encode(txt),c=crc32(data),h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,c,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer),nb,data);const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,c,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);cen.push(new Uint8Array(ch.buffer),nb);off+=30+nb.length+data.length}
  const cs=cen.reduce((s,x)=>s+x.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'})}
function backup(){const sites={...SITES,...S.sites};return JSON.stringify({app:'biomass-field',v:1,source:'lite',exported:new Date().toISOString(),plots:S.plots,recs:S.recs,sites,strata:[...new Set([...LAND,...S.plots.map(p=>p.strata)])],custom:[]})}
function summaryText(){const all=S.plots.map(p=>({p,s:sumPlot(p)})),st=stats(all.map(x=>x.s.tha.total));
  return `Tree carbon survey – ${new Date().toISOString().slice(0,10)}${S.who?' – '+S.who:''}\n${all.length} plots, average ${f(st.mean)} t C/ha\n`+all.map(x=>`${x.p.pid} (${x.p.strata}): ${f(x.s.tha.total)} t C/ha, ${x.s.n.tree} big + ${x.s.n.sap} small trees`).join('\n')}

function send(){bar('');const n=S.plots.length,d=new Date().toISOString().slice(0,10),who=(S.who||'field').replace(/\W+/g,'_');
  $('#app').innerHTML=`<h2>Send my data</h2><p class="mut">Sends one Excel file (a sheet each for the plot summary, young plants, small trees, big trees and stumps, with every tree and its carbon) and a data file for the full Biomass Field Sampler. ${n} plot${n===1?'':'s'} recorded.</p>

  let arm=0;$('#wipe').onclick=()=>{if(Date.now()-arm>4000){arm=Date.now();$('#wipe').textContent='Tap again to delete everything';return}S.plots=[];S.recs=[];save();toast('All data deleted');go('home')}}
